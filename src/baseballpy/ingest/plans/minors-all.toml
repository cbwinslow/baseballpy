# Built-in plan "minors-all": the MLB games of every level back to 2008, newest season first. About 60 GB and a day
# and a half in all (measured at 3.2 GB per season; 2020 had no minor-league season; the minor-league games before 2021
# were never in the lake). On a small disk run it in slices: `baseballpy backfill minors-all --seasons 2014-2019
# --min-free-gb 10` (the size estimate follows the seasons), then again with other seasons. Run it with `--dry-run` first.

[[stage]]
name = "mlb-api-all-levels"
sources = ["mlb_api"]
datasets = ["games"]
seasons = "2008-current"
estimate_gb = 61.0
options = { sports = "all" }
