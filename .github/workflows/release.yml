name: Release

# Runs when the owner pushes a version tag (vX.Y.Z) to publish to PyPI. Also supports
# manual workflow_dispatch runs to build and run twine check without publishing.
# Publishing uses PyPI "trusted publishing" (OpenID Connect): no API token is stored anywhere.
on:
  push:
    tags:
      - "v*"
  # Allows manual runs to test build and twine check without publishing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and twine check without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Only verify tag match on tag push; skip on manual workflow_dispatch dry-runs.
      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only run the publish job on tag pushes, skipping on manual workflow_dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The "pypi" environment can be set to require the owner's approval before the upload runs.
    environment:
      name: pypi
      url: https://pypi.org/p/baseballpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The publish step must run only on a tag push, never on a manual dispatch.
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/v')
