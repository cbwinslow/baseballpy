name: Release

# Runs only when the owner pushes a version tag (vX.Y.Z). Nothing else triggers it, so merging or
# pushing code never publishes. Publishing uses PyPI "trusted publishing" (OpenID Connect): no API
# token is stored anywhere. One-time setup is in docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag must match the version in pyproject.toml
        run: |
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The "pypi" environment can be set to require the owner's approval before the upload runs.
    environment:
      name: pypi
      url: https://pypi.org/p/baseballpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
