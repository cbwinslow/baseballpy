name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same branch or pull request when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Guard against stuck linting processes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  types:
    runs-on: ubuntu-latest
    # Guard against type checker hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run mypy --strict src

  test:
    runs-on: ${{ matrix.os }}
    # Guard against test suite deadlocks across OS/Python combinations.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      # The socket guard is on by default (pyproject addopts); live tests are opt-in.
      # Report the 25 slowest tests to monitor runtime performance regressions.
      - run: uv run pytest -m "not live" --durations=25 --cov=baseballpy --cov-fail-under=90

  # Service containers exist only on Linux runners, so the real-PostgreSQL tests run in this job.
  test-postgres:
    runs-on: ubuntu-latest
    # Guard against service container or database migration timeouts.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest -m "not live" tests/test_export.py tests/test_dlt_typed.py --no-cov
        env:
          BASEBALLPY_TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/postgres

  docs:
    runs-on: ubuntu-latest
    # Guard against doc generation and mkdocs build timeouts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group docs
      # Fails when the generated column dictionaries or docs/CLI.md are stale.
      - run: uv run baseballpy docs generate --check
      - run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  specs:
    runs-on: ubuntu-latest
    # Guard against specification validator hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Every spec has Purpose/Requirements and a scenario per requirement.
      - run: npx --yes @fission-ai/openspec@1.14.1 validate --specs

  build:
    runs-on: ubuntu-latest
    # Guard against packaging or twine check hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*

  # Verify that non-Python data files and plans are included in the distribution wheel.
  package-data:
    runs-on: ubuntu-latest
    # Guard against wheel inspection timeouts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - run: python -c "import glob, sys, zipfile; wheels = glob.glob('dist/*.whl'); assert wheels, 'No wheel found in dist/'; z = zipfile.ZipFile(wheels[0]); req = ['baseballpy/core/sources_lock.json', 'baseballpy/sources/mlb_api/unavailable_games.json', 'baseballpy/ingest/plans/daily.toml', 'baseballpy/ingest/plans/full.toml', 'baseballpy/ingest/plans/minors.toml', 'baseballpy/ingest/plans/minors-all.toml']; m = [p for p in req if p not in z.namelist()]; (print('Missing package data in wheel:', m), sys.exit(1)) if m else print('All package data verified in wheel')"
