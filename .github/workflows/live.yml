name: Weekly upstream audit

# Talks to the real upstreams (Baseball Savant, MLB Stats API, GitHub): never part of the PR gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: write

env:
  # One open issue carries the findings; a later run comments on it instead of opening another.
  AUDIT_ISSUE_TITLE: "Upstream audit findings"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      # Provider-listed items vs the registry; exits 1 on MISSING/REVIVED/ERROR findings. The
      # step may not stop the job: the findings are reported below, then the job fails.
      - id: audit
        continue-on-error: true
        run: uv run baseballpy catalog audit --json > catalog-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-audit
          path: catalog-audit.json
      - name: Report audit findings as an issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "The weekly audit found differences between the providers and the registry."
            echo
            echo "Run: ${run_url} (artifact \`upstream-audit\`)."
            echo
            echo '```json'
            head -c 50000 catalog-audit.json
            echo '```'
          } > issue-body.md
          existing=$(gh issue list --state open --search "\"${AUDIT_ISSUE_TITLE}\" in:title" \
            --json number,title --jq "map(select(.title == \"${AUDIT_ISSUE_TITLE}\")) | .[0].number // empty")
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file issue-body.md
          else
            gh issue create --title "${AUDIT_ISSUE_TITLE}" --body-file issue-body.md
          fi
      # One small real request per provider (tests/live): proves the fixtures still match.
      - run: uv run pytest tests/live -m live --force-enable-socket
      - name: Fail the job when the audit found something
        if: always() && steps.audit.outcome == 'failure'
        run: exit 1
