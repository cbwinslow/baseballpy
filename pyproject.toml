[project]
name = "baseballpy"
version = "0.1.0"
description = "Fast, modular, and strongly-typed baseball data ingestion layer for Statcast, MLB API, Lahman, Chadwick, and Retrosheet into DuckDB, Polars, PyArrow, and dlt."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Blaine Winslow" }]
keywords = [
  "baseball",
  "statcast",
  "mlb-api",
  "retrosheet",
  "lahman",
  "chadwick",
  "sabermetrics",
  "duckdb",
  "polars",
  "pyarrow",
  "dlt",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

dependencies = [
  "chadwickpy>=0.4.0",
  "pyarrow>=16.0.0",
  "duckdb>=1.0.0",
  "polars>=1.0.0",
  "dlt[duckdb]>=1.0.0",
  "narwhals>=1.10.0",
  "msgspec>=0.18.0",
  "httpx[http2]>=0.27.0",
  "pydantic>=2.7.0",
  "tenacity>=8.3.0",
  "aiolimiter>=1.1.0",
  "rich>=13.7.0",
  "click>=8.1.0",
  "pydantic-settings>=2.16.1",
]

[project.optional-dependencies]
# chadwickpy (GPL) is a core dependency; this extra is kept as an alias for older install commands.
retrosheet = ["chadwickpy>=0.4.0"]
pandas = ["pandas>=2.2.0"]
dlt-postgres = ["dlt[postgres]>=1.0.0"]
dlt-snowflake = ["dlt[snowflake]>=1.0.0"]
dlt-bigquery = ["dlt[bigquery]>=1.0.0"]
dlt-motherduck = ["dlt[motherduck]>=1.0.0"]
all = [
  "baseballpy[retrosheet,pandas,dlt-postgres,dlt-snowflake]",
]

[project.scripts]
baseballpy = "baseballpy.cli:main"

[project.urls]
Homepage = "https://github.com/cbwinslow/baseballpy"
Source = "https://github.com/cbwinslow/baseballpy"
Issues = "https://github.com/cbwinslow/baseballpy/issues"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "pytest-cov>=5.0.0",
  "pytest-socket>=0.7.0",
  "pytest-timeout>=2.3.0",
  "hypothesis>=6.100.0",
  "respx>=0.21.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pgserver>=0.1.4",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "D1", "S", "PLR0912", "PLR0915"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "S101"]  # asserts are the test mechanism

[tool.ruff.lint.pylint]
# Parsers, flatteners and CLI option handlers are branchy by nature; these ceilings stop growth.
# Functions near them are the refactoring backlog (ruff reports anything above).
max-branches = 22
max-statements = 70

[tool.coverage.report]
fail_under = 90

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Unit tests never touch the network (AGENTS §9.4): only loopback is allowed (asyncio self-pipe).
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
timeout = 300
markers = [
  "live: hits real upstream endpoints (run manually with -m live --force-enable-socket)",
  "smoke_live: live end-to-end smoke tests (manual)",
  "slow: slow tests",
]
