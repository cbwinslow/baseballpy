# Per-game MLB data (boxscore, live feed, play-by-play, win probability, linescore) for the seasons
# not yet downloaded, newest first, then the live sources kept current. Major leagues only (ADR 85).
# Run: baseballpy run plans/mlb-games-history.toml --every 24h
# Each stage is one season; a finished season is compacted before the next starts (disk).

[[stage]]
name = "games 2024"
sources = ["mlb_api"]
seasons = "2024"
datasets = ["games"]
estimate_gb = 3

