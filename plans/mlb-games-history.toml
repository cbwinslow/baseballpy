# After the history, keep the live sources current. Repeated every round (`--every 24h`), these
# fetch only what is new: a rerun skips every chunk that is already complete.
[[stage]]
name = "markets"
sources = ["kalshi", "polymarket"]
estimate_gb = 0.1

[[stage]]
name = "statcast-current"
sources = ["statcast"]
seasons = "current"
estimate_gb = 0.5

[[stage]]
name = "games current"
sources = ["mlb_api"]
seasons = "current"
datasets = ["games"]
estimate_gb = 0.5
